name: Build debug APK

# This container's own network policy blocks the Android SDK repository
# (dl.google.com), so debug builds run here on GitHub-hosted runners instead.
# Requires repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings ->
# Secrets and variables -> Actions) for a build that can actually reach the
# target Supabase project; without them the APK still builds but every
# Supabase call is a client-side no-op (see SupabaseApi/ParentApi `enabled`).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Write local.properties from repo secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set. Building anyway, but the APK will have Supabase sync disabled at runtime (see local.properties.example)."
          fi
          cat > local.properties <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish a downloadable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-build-${{ github.run_number }}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug build #${{ github.run_number }}" \
            --notes "Automated debug build from commit ${{ github.sha }} on ${{ github.ref_name }}. Install-only; not a signed release build." \
            --target "${{ github.sha }}"
